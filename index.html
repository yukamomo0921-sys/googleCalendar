<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a9cbd8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7e9ff">
<title>予定一括登録カレンダー</title>
<style>
  :root{
    --blue:#a9cbd8;
    --blue-light:#edf5f7;
    --blue-deep:#789eae;
    --pink:#d8aebb;
    --pink-light:#f7eef1;
    --purple:#9b96bd;
    --purple-light:#f0eff7;
    --navy:#3f5870;
    --text:#536878;
    --muted:#8b9aa4;
    --white:#fff;
    --line:#c7d7de;
    --shadow:0 8px 20px rgba(66,92,108,.09);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;min-height:100vh;color:var(--text);
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Arial Rounded MT Bold",sans-serif;
    background:#f5f9fa;
  }
  button{font:inherit}
  .app{width:min(100%,520px);margin:auto;padding:20px 16px 34px}
  .header{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 16px}
  .brand{
    font-weight:900;font-size:21px;letter-spacing:.04em;color:var(--navy);
  }
  .brand span{
    display:block;font-size:11px;font-weight:700;color:var(--muted);
    margin-top:3px;letter-spacing:.02em;
  }

  /* Rounded-square controls with a soft illustrated outline */
  .today-btn{
    border:2px solid var(--blue-deep);background:#fff;
    border-radius:12px;padding:8px 13px;color:var(--navy);
    font-weight:900;box-shadow:2px 3px 0 rgba(120,158,174,.13);
  }

  .card{
    background:rgba(255,255,255,.96);
    border:2px solid #cddde3;
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:16px;margin-bottom:14px;position:relative;
  }
  .card::before{
    content:"";position:absolute;inset:5px;
    border:1px solid #e3ecef;border-radius:17px;
    pointer-events:none;
  }
  .card>*{position:relative}

  .monthbar{display:flex;align-items:center;justify-content:space-between;padding:3px 2px 14px}
  .month{font-size:20px;font-weight:900;color:var(--navy);letter-spacing:.03em}
  .nav{display:flex;gap:7px}
  .nav button{
    width:40px;height:40px;border:2px solid #b9d1da;
    border-radius:12px;background:var(--blue-light);
    color:var(--navy);font-size:22px;font-weight:900;
    box-shadow:2px 3px 0 rgba(120,158,174,.10);
  }

  .week{
    display:grid;grid-template-columns:repeat(7,1fr);gap:5px;
    text-align:center;color:#8999a3;font-size:11px;font-weight:900;margin-bottom:7px;
  }
  .week div:first-child{color:#b4778b}
  .week div:last-child{color:#6e92a3}

  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .day{
    aspect-ratio:1;border:0;background:#fbfdfe;
    border-radius:15px;
    color:#536878;font-size:14px;font-weight:800;
    position:relative;cursor:pointer;
    box-shadow:inset 0 0 0 1px #e7eef1;
  }
  .day:active{transform:scale(.94)}
  .day.other{color:#d2dce1;background:transparent;box-shadow:none}
  .day.today{box-shadow:inset 0 0 0 2px var(--purple)}

  /* Selected date: square rounded shape + white inner line, like the reference */
  .day.selected{
    color:#fff;
    background:#87adbd;
    border:2px solid #789eae;
    border-radius:15px;
    box-shadow:
      inset 0 0 0 2px #fff,
      2px 3px 0 rgba(63,88,112,.13);
  }
  .day.selected::after{
    content:"✓";position:absolute;right:5px;top:3px;
    font-size:9px;color:#fff;font-weight:900;
  }
  .day.has-event:not(.selected)::before{
    content:"";position:absolute;bottom:5px;left:50%;
    transform:translateX(-50%);width:6px;height:6px;
    border-radius:50%;background:var(--purple);
  }

  .label{font-size:13px;font-weight:900;margin:4px 2px 10px;color:var(--navy)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 5px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:2px solid #dce7eb;background:#fff;
    border-radius:12px;padding:9px 13px;color:#637581;font-weight:900;
  }
  .chip.active{
    border-color:var(--pink);background:var(--pink-light);
    color:#8e6273;box-shadow:2px 3px 0 rgba(216,174,187,.16);
  }

  .summary{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .count{font-size:13px;color:#8998a1;line-height:1.6}
  .count strong{font-size:18px;color:var(--navy)}

  .add{
    width:100%;border:2px solid #6f98aa;border-radius:14px;
    padding:14px 16px;margin-top:12px;color:#fff;font-weight:900;font-size:16px;
    background:#789eae;box-shadow:3px 4px 0 rgba(63,88,112,.14);
  }
  .add:disabled{opacity:.45;box-shadow:none}
  .notice{font-size:11px;color:#9aa7ae;text-align:center;margin:10px 4px 0;line-height:1.6}
  .results{display:none;margin-top:14px;padding-top:14px;border-top:2px dashed #d7e2e6}
  .results.show{display:block}
  .event-link{
    display:flex;align-items:center;justify-content:space-between;text-decoration:none;
    color:var(--navy);background:#f1f7f9;
    border:1px solid #d7e5e9;border-radius:13px;
    padding:11px 12px;margin-top:7px;font-size:13px;font-weight:800;
  }
  .event-link span{font-size:11px;color:#8c9aa3}
  @media (min-width:480px){.app{padding-top:28px}.card{padding:20px}}

</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="brand">予定一括登録<span>タップして、かんたん予定登録</span></div>
    <button class="today-btn" id="todayBtn">今日</button>
  </header>

  <section class="card">
    <div class="monthbar">
      <div class="month" id="monthTitle"></div>
      <div class="nav"><button id="prev" aria-label="前の月">‹</button><button id="next" aria-label="次の月">›</button></div>
    </div>
    <div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
    <div class="grid" id="calendar"></div>
  </section>

  <section class="card">
    <div class="label">予定の種類</div>
    <div class="chips" id="chips">
      <button class="chip active" data-title="休み">🏖️ 休み</button>
      <button class="chip" data-title="バイト">💼 バイト</button>
      <button class="chip" data-title="授業">🏫 授業</button>
      <button class="chip" data-title="制作">🎨 制作</button>
      <button class="chip" data-title="締切">📌 締切</button>
      <button class="chip" data-title="その他">✨ その他</button>
    </div>

    <div class="summary">
      <div class="count" id="count">日付を選択してください</div>
    </div>
    <div class="results" id="results"></div>
  </section>
</div>

<script>
const state = {
  view: new Date(),
  selected: new Set(),
  title: "休み"
};

const monthTitle = document.getElementById("monthTitle");
const calendar = document.getElementById("calendar");
const count = document.getElementById("count");
const results = document.getElementById("results");

function key(y,m,d){ return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
function padDate(y,m,d){ return `${y}${String(m+1).padStart(2,"0")}${String(d).padStart(2,"0")}`; }

function render(){
  const y = state.view.getFullYear(), m = state.view.getMonth();
  monthTitle.textContent = `${y}年 ${m+1}月`;
  calendar.innerHTML = "";

  const first = new Date(y,m,1).getDay();
  const days = new Date(y,m+1,0).getDate();
  const prevDays = new Date(y,m,0).getDate();

  for(let i=0;i<first;i++){
    const d = prevDays-first+i+1;
    const b = document.createElement("button");
    b.className = "day other";
    b.textContent = d;
    calendar.appendChild(b);
  }

  const now = new Date();
  for(let d=1; d<=days; d++){
    const k = key(y,m,d);
    const b = document.createElement("button");
    b.className = "day";
    b.textContent = d;
    if(y===now.getFullYear() && m===now.getMonth() && d===now.getDate()) b.classList.add("today");
    if(state.selected.has(k)) b.classList.add("selected");
    b.addEventListener("click",()=>{
      state.selected.has(k) ? state.selected.delete(k) : state.selected.add(k);
      // 日付を押した瞬間に、下の予定一覧も同期
      render();
      renderResults();
    });
    calendar.appendChild(b);
  }

  const cells = first+days;
  const tail = (7 - cells%7)%7;
  for(let d=1; d<=tail; d++){
    const b = document.createElement("button");
    b.className = "day other";
    b.textContent = d;
    calendar.appendChild(b);
  }
  updateSummary();
}

function updateSummary(){
  const n = state.selected.size;
  count.innerHTML = n ? `<strong>${n}日</strong> 選択中` : "日付を選択してください";
}

function moveMonth(delta){
  state.view = new Date(state.view.getFullYear(), state.view.getMonth()+delta, 1);
  render();
  renderResults();
}

document.getElementById("prev").onclick=()=>moveMonth(-1);
document.getElementById("next").onclick=()=>moveMonth(1);
document.getElementById("todayBtn").onclick=()=>{
  const now=new Date();
  state.view=new Date(now.getFullYear(),now.getMonth(),1);
  render();
  renderResults();
};

document.querySelectorAll(".chip").forEach(chip=>{
  chip.addEventListener("click",()=>{
    document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
    chip.classList.add("active");
    state.title=chip.dataset.title;
    renderResults();
  });
});

function googleCalendarUrl(date, title){
  const [y,m,d] = date.split("-").map(Number);
  const start = padDate(y,m-1,d);
  const next = new Date(y,m-1,d+1);
  const end = padDate(next.getFullYear(),next.getMonth(),next.getDate());
  const params = new URLSearchParams({
    action:"TEMPLATE",
    text:title,
    dates:`${start}/${end}`,
    ctz:"Asia/Tokyo"
  });
  return "https://calendar.google.com/calendar/render?"+params.toString();
}

function renderResults(){
  const dates=[...state.selected].sort();

  // 選択日がなくなったら、下の一覧も完全に消す
  if (!dates.length) {
    results.innerHTML="";
    results.classList.remove("show");
    return;
  }

  results.innerHTML="";
  results.classList.add("show");

  const heading=document.createElement("div");
  heading.className="label";
  heading.textContent="追加する予定";
  results.appendChild(heading);

  dates.forEach(date=>{
    const a=document.createElement("a");
    a.className="event-link";
    a.href=googleCalendarUrl(date,state.title);
    a.target="_blank";
    a.rel="noopener";
    const label=document.createElement("span");
    label.textContent=date.replaceAll("-","/");
    const text=document.createElement("b");
    text.textContent=`${state.title} を追加 →`;
    a.append(label,text);
    results.appendChild(a);
  });
}

render();
renderResults();
</script>
</body>
</html>
