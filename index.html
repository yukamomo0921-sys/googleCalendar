<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7e9ff">
<title>予定らくがきカレンダー</title>
<style>
  :root{
    --blue:#bfeaf7;
    --blue-light:#eaf9fd;
    --blue-deep:#78c9df;
    --pink:#f6b9d3;
    --pink-light:#fff0f6;
    --purple:#a99be3;
    --purple-light:#f1edff;
    --text:#5f6470;
    --muted:#9298a3;
    --white:#fff;
    --line:#d9e5e9;
    --shadow:0 8px 20px rgba(83,139,153,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0; min-height:100vh; color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:#eefafd;
    background-image:
      radial-gradient(circle at 12px 12px, rgba(120,201,223,.10) 1.5px, transparent 1.6px);
    background-size:24px 24px;
  }
  button{font:inherit}
  .app{width:min(100%,520px);margin:auto;padding:20px 16px 34px}
  .header{
    display:flex;align-items:center;justify-content:space-between;
    margin:4px 4px 16px;
  }
  .brand{
    font-weight:850;font-size:21px;letter-spacing:.04em;
    color:#536774; transform:rotate(-1deg);
  }
  .brand span{
    display:block;font-size:11px;font-weight:650;color:var(--muted);
    margin-top:3px;letter-spacing:.02em;
  }
  .today-btn{
    border:0;background:var(--white);
    border-radius:13px 11px 14px 10px;padding:8px 13px;
    color:#5f9bb0;font-weight:800;box-shadow:2px 3px 0 rgba(120,201,223,.18);
    position:relative;
  }
  .today-btn::before{
    content:"";position:absolute;inset:-2px;border:2px solid var(--blue-deep);
    border-radius:14px 10px 15px 11px;pointer-events:none;
    filter:url(#pencilWobble);
  }
  .card{
    background:rgba(255,255,255,.94);
    border:0;
    border-radius:23px 20px 25px 19px;
    box-shadow:var(--shadow);padding:16px;margin-bottom:14px;
    position:relative;
  }
  .card::before{
    content:"";position:absolute;inset:-1px;
    border:2px solid #d6e9ee;
    border-radius:24px 19px 26px 18px;
    pointer-events:none;
    filter:url(#pencilWobble);
  }
  .card::after{
    content:"";position:absolute;inset:5px;
    border:1px solid rgba(120,201,223,.28);
    border-radius:18px 15px 20px 16px;
    pointer-events:none;
    filter:url(#pencilWobble);
  }
  .card>*{position:relative}
  .monthbar{display:flex;align-items:center;justify-content:space-between;padding:3px 2px 14px}
  .month{font-size:20px;font-weight:850;color:#596b73;letter-spacing:.03em}
  .nav{display:flex;gap:7px}
  .nav button{
    width:40px;height:40px;border:0;
    border-radius:12px 10px 13px 9px;background:var(--blue-light);
    color:#6a9cac;font-size:22px;font-weight:900;
    box-shadow:2px 3px 0 rgba(120,201,223,.12);
    position:relative;
  }
  .nav button::before{
    content:"";position:absolute;inset:-1px;border:2px solid var(--blue);
    border-radius:13px 9px 14px 10px;pointer-events:none;
    filter:url(#pencilWobble);
  }
  .week{
    display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;
    color:#9ba6ab;font-size:11px;font-weight:850;margin-bottom:7px;
  }
  .week div:first-child{color:#dc91b1}.week div:last-child{color:#6eaec0}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .day{
    aspect-ratio:1;border:0;background:#fbfeff;border-radius:15px 12px 16px 11px;
    color:#626a71;font-size:14px;font-weight:750;position:relative;cursor:pointer;
    box-shadow:inset 0 0 0 1px #edf3f5;
  }
  .day:nth-child(3n){transform:rotate(.5deg)}
  .day:nth-child(4n){transform:rotate(-.5deg)}
  .day:active{transform:scale(.94) rotate(0)}
  .day.other{color:#d2dadd;background:transparent;box-shadow:none}
  .day.today{box-shadow:inset 0 0 0 2px var(--purple)}
  .day.selected{
    color:#4e6871;background:var(--blue);
    box-shadow:2px 3px 0 rgba(120,201,223,.16);
    position:relative;
  }
  .day.selected::before{
    content:"";position:absolute;inset:1px;
    border:2px solid #8ed1e2;
    border-radius:15px 12px 16px 11px;
    pointer-events:none;
    filter:url(#pencilWobble);
  }
  .day.selected::after{
    content:"✓";position:absolute;right:4px;top:2px;font-size:9px;color:#fff;font-weight:900;
  }
  .day.has-event:not(.selected)::before{
    content:"";position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
    width:6px;height:6px;border-radius:50%;background:var(--purple);
  }
  .label{font-size:13px;font-weight:850;margin:4px 2px 10px;color:#6f7d83}
  .chips{
    display:flex;gap:8px;overflow-x:auto;padding:2px 1px 5px;scrollbar-width:none
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:0;background:#fff;
    border-radius:13px 11px 14px 10px;padding:9px 13px;color:#727c82;font-weight:800;
    position:relative;
  }
  .chip::before{
    content:"";position:absolute;inset:-1px;
    border:2px solid #e0e9ec;
    border-radius:14px 10px 15px 11px;pointer-events:none;
    filter:url(#pencilWobble);
  }
  .chip:nth-child(odd){transform:rotate(-.5deg)}
  .chip:nth-child(even){transform:rotate(.5deg)}
  .chip.active{
    background:var(--pink-light);color:#a46d84;
    box-shadow:2px 3px 0 rgba(246,185,211,.22);
  }
  .chip.active::before{
    border-color:var(--pink);
  }
  .summary{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .count{font-size:13px;color:#8a9499;line-height:1.6}
  .count strong{font-size:18px;color:#66777e}
  .add{
    width:100%;border:0;border-radius:16px 13px 17px 12px;
    padding:14px 16px;margin-top:12px;color:#fff;font-weight:900;font-size:16px;
    background:var(--blue-deep);
    box-shadow:3px 4px 0 rgba(91,170,194,.20);
    position:relative;
  }
  .add::before{
    content:"";position:absolute;inset:-2px;border:2px solid #63b5ce;
    border-radius:17px 12px 18px 11px;pointer-events:none;
    filter:url(#pencilWobble);
  }
  .add:disabled{opacity:.45;box-shadow:none}
  .notice{font-size:11px;color:#9aa3a8;text-align:center;margin:10px 4px 0;line-height:1.6}
  .results{display:none;margin-top:14px;padding-top:14px;border-top:2px dashed #dce7ea}
  .results.show{display:block}
  .event-link{
    display:flex;align-items:center;justify-content:space-between;text-decoration:none;
    color:#68747b;background:var(--blue-light);
    border:1px solid #d6edf3;border-radius:14px 12px 15px 11px;
    padding:11px 12px;margin-top:7px;font-size:13px;font-weight:750;
  }
  .event-link span{font-size:11px;color:#9aa4aa}
  @media (min-width:480px){
    .app{padding-top:28px}.card{padding:20px}
  }
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <filter id="pencilWobble" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
<div class="app">
  <header class="header">
    <div class="brand">予定らくがき<span>タップして、かんたん予定登録</span></div>
    <button class="today-btn" id="todayBtn">今日</button>
  </header>

  <section class="card">
    <div class="monthbar">
      <div class="month" id="monthTitle"></div>
      <div class="nav"><button id="prev" aria-label="前の月">‹</button><button id="next" aria-label="次の月">›</button></div>
    </div>
    <div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
    <div class="grid" id="calendar"></div>
  </section>

  <section class="card">
    <div class="label">予定の種類</div>
    <div class="chips" id="chips">
      <button class="chip active" data-title="休み">🏖️ 休み</button>
      <button class="chip" data-title="バイト">💼 バイト</button>
      <button class="chip" data-title="授業">🏫 授業</button>
      <button class="chip" data-title="制作">🎨 制作</button>
      <button class="chip" data-title="締切">📌 締切</button>
      <button class="chip" data-title="その他">✨ その他</button>
    </div>

    <div class="summary">
      <div class="count" id="count">日付を選択してください</div>
    </div>
    <button class="add" id="addBtn" disabled>Googleカレンダーに追加</button>
    <div class="notice">選択した日付ごとにGoogleカレンダーの予定作成画面を開きます。</div>
    <div class="results" id="results"></div>
  </section>
</div>

<script>
const state = {
  view: new Date(),
  selected: new Set(),
  title: "休み"
};

const monthTitle = document.getElementById("monthTitle");
const calendar = document.getElementById("calendar");
const count = document.getElementById("count");
const addBtn = document.getElementById("addBtn");
const results = document.getElementById("results");

function key(y,m,d){ return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
function padDate(y,m,d){ return `${y}${String(m+1).padStart(2,"0")}${String(d).padStart(2,"0")}`; }

function render(){
  const y = state.view.getFullYear(), m = state.view.getMonth();
  monthTitle.textContent = `${y}年 ${m+1}月`;
  calendar.innerHTML = "";

  const first = new Date(y,m,1).getDay();
  const days = new Date(y,m+1,0).getDate();
  const prevDays = new Date(y,m,0).getDate();

  for(let i=0;i<first;i++){
    const d = prevDays-first+i+1;
    const b = document.createElement("button");
    b.className = "day other";
    b.textContent = d;
    calendar.appendChild(b);
  }

  const now = new Date();
  for(let d=1; d<=days; d++){
    const k = key(y,m,d);
    const b = document.createElement("button");
    b.className = "day";
    b.textContent = d;
    if(y===now.getFullYear() && m===now.getMonth() && d===now.getDate()) b.classList.add("today");
    if(state.selected.has(k)) b.classList.add("selected");
    b.addEventListener("click",()=>{
      state.selected.has(k) ? state.selected.delete(k) : state.selected.add(k);
      render();
    });
    calendar.appendChild(b);
  }

  const cells = first+days;
  const tail = (7 - cells%7)%7;
  for(let d=1; d<=tail; d++){
    const b = document.createElement("button");
    b.className = "day other";
    b.textContent = d;
    calendar.appendChild(b);
  }
  updateSummary();
}

function updateSummary(){
  const n = state.selected.size;
  count.innerHTML = n ? `<strong>${n}日</strong> 選択中` : "日付を選択してください";
  addBtn.disabled = n===0;
}

function moveMonth(delta){
  state.view = new Date(state.view.getFullYear(), state.view.getMonth()+delta, 1);
  render();
}

document.getElementById("prev").onclick=()=>moveMonth(-1);
document.getElementById("next").onclick=()=>moveMonth(1);
document.getElementById("todayBtn").onclick=()=>{
  const now=new Date();
  state.view=new Date(now.getFullYear(),now.getMonth(),1);
  render();
};

document.querySelectorAll(".chip").forEach(chip=>{
  chip.addEventListener("click",()=>{
    document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
    chip.classList.add("active");
    state.title=chip.dataset.title;
  });
});

function googleCalendarUrl(date, title){
  const [y,m,d] = date.split("-").map(Number);
  const start = padDate(y,m-1,d);
  const next = new Date(y,m-1,d+1);
  const end = padDate(next.getFullYear(),next.getMonth(),next.getDate());
  const params = new URLSearchParams({
    action:"TEMPLATE",
    text:title,
    dates:`${start}/${end}`,
    ctz:"Asia/Tokyo"
  });
  return "https://calendar.google.com/calendar/render?"+params.toString();
}

addBtn.onclick=()=>{
  const dates=[...state.selected].sort();
  results.innerHTML="";
  results.classList.add("show");

  const heading=document.createElement("div");
  heading.className="label";
  heading.textContent="追加する予定";
  results.appendChild(heading);

  dates.forEach(date=>{
    const a=document.createElement("a");
    a.className="event-link";
    a.href=googleCalendarUrl(date,state.title);
    a.target="_blank";
    a.rel="noopener";
    const label=document.createElement("span");
    label.textContent=date.replaceAll("-","/");
    const text=document.createElement("b");
    text.textContent=`${state.title} を追加 →`;
    a.append(label,text);
    results.appendChild(a);
  });
  results.scrollIntoView({behavior:"smooth",block:"nearest"});
};

render();
</script>
</body>
</html>
